[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
    "main.py",
    "app/db/session.py",
    "app/security.py",
    "app/routers/accounts.py",
    "app/routers/admin/auth.py",
    "app/routers/admin/admincases.py",
    "app/routers/admin/adminstaff.py",
    "app/routers/admin/dashboard.py",
    "app/routers/mobile_auth.py",
    "app/routers/mobile_content.py",
    "app/routers/mobile_dependencies.py",
    "app/routers/mobile_api.py",
    "app/routers/mobile_submissions.py",
    "app/services/donations.py",
    "tests/support.py",
    "tests/test_app_factory.py",
]
ignore_missing_imports = true
follow_imports = "skip"
