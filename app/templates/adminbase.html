<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Admin Workspace - Aurorah CAN{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff1f8',
              100: '#ffe4f2',
              500: '#FF2E93',
              600: '#E0257F',
              700: '#C61D69',
              800: '#9B1E59',
              900: '#4A0D2C'
            },
            canvas: {
              950: '#09090B',
              900: '#121215',
              800: '#18181B',
              700: '#27272A'
            }
          },
          fontFamily: { sans: ['Segoe UI', 'Roboto', 'Helvetica Neue', 'sans-serif'] }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/modern.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-body">
  <a class="admin-skip-link" href="#admin-main">Skip to workspace</a>
  {% block content %}{% endblock %}
</body>
</html>
