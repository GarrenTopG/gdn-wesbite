<!-- EDIT NEWS ARTICLE MODAL -->
<div id="editNewsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-xl">
    <div class="flex justify-between items-center border-b pb-3">
      <h3 class="font-bold text-lg text-gray-900">Edit News Article</h3>
      <button type="button" onclick="toggleModal('editNewsModal')" aria-label="Close modal" title="Close modal" class="text-gray-400 hover:text-gray-600">
        <i class="fa-solid fa-xmark text-lg" aria-hidden="true"></i>
      </button>
    </div>
    
    <form id="editNewsForm" action="" method="POST" onsubmit="toggleModal('editNewsModal')" class="space-y-4 text-xs">
      <div>
        <label for="edit_news_title" class="block font-bold text-gray-700 mb-1">Article Title</label>
        <input type="text" id="edit_news_title" name="title" required class="w-full p-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-800 focus:outline-none">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="edit_news_category" class="block font-bold text-gray-700 mb-1">Category</label>
          <select id="edit_news_category" name="category" class="w-full p-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-800 focus:outline-none">
            <option value="Community Outreaches">Community Outreaches</option>
            <option value="Impact Update">Impact Update</option>
            <option value="Announcements">Announcements</option>
          </select>
        </div>
        <div>
          <label for="edit_news_image_url" class="block font-bold text-gray-700 mb-1">Image URL</label>
          <input type="url" id="edit_news_image_url" name="image_url" placeholder="https://..." class="w-full p-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-800 focus:outline-none">
        </div>
      </div>

      <div>
        <label for="edit_news_summary" class="block font-bold text-gray-700 mb-1">Brief Summary</label>
        <input type="text" id="edit_news_summary" name="summary" required class="w-full p-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-800 focus:outline-none">
      </div>

      <div>
        <label for="edit_news_content" class="block font-bold text-gray-700 mb-1">Full Article Content</label>
        <textarea id="edit_news_content" name="content" rows="6" required class="w-full p-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-800 focus:outline-none font-sans leading-relaxed"></textarea>
      </div>

      <div class="flex justify-end space-x-2 pt-2">
        <button type="button" onclick="toggleModal('editNewsModal')" class="px-4 py-2 bg-gray-100 font-bold rounded-xl text-gray-600">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-brand-800 text-white font-bold rounded-xl hover:bg-brand-900">Update Article</button>
      </div>
    </form>
  </div>
</div>

<script>
function handleEditNewsClick(btn) {
  const id = btn.getAttribute('data-id');
  const title = btn.getAttribute('data-title');
  const category = btn.getAttribute('data-category');
  const summary = btn.getAttribute('data-summary');
  const content = btn.getAttribute('data-content');
  const imageUrl = btn.getAttribute('data-image-url');

  const form = document.getElementById('editNewsForm');
  if (form) {
    form.action = `/admin/news/${id}/edit`;
  }
  
  document.getElementById('edit_news_title').value = title || '';
  document.getElementById('edit_news_category').value = category || 'Community Outreaches';
  document.getElementById('edit_news_summary').value = summary || '';
  document.getElementById('edit_news_content').value = content || '';
  document.getElementById('edit_news_image_url').value = imageUrl || '';
  
  toggleModal('editNewsModal');
}
</script>
