<!-- ADD NEWS ARTICLE MODAL -->
<div id="addNewsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-xl">
    <div class="flex justify-between items-center border-b pb-3">
      <h3 class="font-bold text-lg text-gray-900">Publish News Article</h3>
      <button type="button" onclick="toggleModal('addNewsModal')" aria-label="Close modal" title="Close" class="text-gray-400 hover:text-gray-600">
        <i class="fa-solid fa-xmark text-lg" aria-hidden="true"></i>
      </button>
    </div>
    <form action="/admin/news/add" method="POST" class="space-y-4 text-xs">
      <div>
        <label for="news_title" class="block font-bold text-gray-700 mb-1">Article Title</label>
        <input type="text" id="news_title" name="title" required placeholder="Enter article title" title="Article Title" class="w-full p-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-800 focus:outline-none">
      </div>
      <div>
        <label for="news_category" class="block font-bold text-gray-700 mb-1">Category</label>
        <select id="news_category" name="category" title="Select Category" class="w-full p-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-800 focus:outline-none">
          <option value="Community Outreaches">Community Outreaches</option>
          <option value="Impact Update">Impact Update</option>
          <option value="Announcements">Announcements</option>
        </select>
      </div>
      <div>
        <label for="news_summary" class="block font-bold text-gray-700 mb-1">Brief Summary</label>
        <input type="text" id="news_summary" name="summary" required placeholder="Enter a 1-2 sentence summary" title="Article Summary" class="w-full p-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-800 focus:outline-none">
      </div>
      <div>
        <label for="news_content" class="block font-bold text-gray-700 mb-1">Content</label>
        <textarea id="news_content" name="content" rows="4" required placeholder="Enter article content details..." title="Article Content" class="w-full p-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-800 focus:outline-none"></textarea>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button type="button" onclick="toggleModal('addNewsModal')" class="px-4 py-2 bg-gray-100 font-bold rounded-xl text-gray-600">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-brand-800 text-white font-bold rounded-xl hover:bg-brand-900">Publish</button>
      </div>
    </form>
  </div>
</div>
