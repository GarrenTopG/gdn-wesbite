name: Quality

on:
  push:
  pull_request:

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/check.py

  frontend-build:
    name: Frontend CSS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code -- app/static/css/tailwind.css app/static/css/admin-tailwind.css
